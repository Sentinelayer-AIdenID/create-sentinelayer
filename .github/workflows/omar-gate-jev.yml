name: Omar Gate (Jev)
on:
  pull_request:
    types: [opened, synchronize, reopened]
# Write scopes publish the PR report (comment + check run, tagged jev so it
# never overwrites the legacy Omar Gate's), exactly like the legacy
# omar-gate.yml. GitHub gives fork PRs a read-only token.
permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write
# NOTE: Uses pull_request (not pull_request_target) because this workflow is
# NEW in this PR and does not exist on main yet. pull_request_target would
# load from main where the file is absent, so the check would not run.
# After this PR merges, a follow-up PR MUST switch to pull_request_target
# so that future PR modifications to this file cannot exfiltrate secrets.
# Fork PRs: the job runs on every PR. fork_policy: block (below) ensures
# the action fails closed when secrets are absent (e.g. fork PRs where
# the token is read-only and private secrets are unavailable).
# The main omar-gate.yml covers fork PRs with its untrusted scan path.
jobs:
  omar-jev:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Omar Gate (Jev intent cascade)
        uses: Sentinelayer-AIdenID/sentinelayer-v1-action@ebfcb813126ff64f21bb1fccfef8ab30609af67c
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          review_routing: intent-cascade-v1
          llm_provider: typesafe
          typesafe_api_key: ${{ secrets.TYPESAFE_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          intent_model_pin: ${{ secrets.INTENT_MODEL_PIN }}
          intent_policy: ${{ secrets.INTENT_POLICY }}
          intent_price_profile: typesafe-input-20261020
          sentinelayer_token: ${{ secrets.SENTINELAYER_TOKEN }}
          scan_mode: pr-diff
          severity_gate: P1
          codex_model: gpt-6-sol
          use_codex: "false"
          codex_only: "false"
          sentinelayer_managed_llm: "false"
          llm_failure_policy: block
          fork_policy: block
          publish_github: "true"
          comment_tag: jev
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        if: always()
        with:
          name: omar-jev-${{ github.run_id }}
          path: .sentinelayer/runs/
          include-hidden-files: true
          if-no-files-found: error
