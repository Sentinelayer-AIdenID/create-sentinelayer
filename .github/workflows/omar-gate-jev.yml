name: Omar Gate (Jev)
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
# Write scopes publish the PR report (comment + check run, tagged jev so it never overwrites the legacy Omar Gate's), exactly like the legacy omar-gate.yml. GitHub gives fork PRs a read-only token, and fork_policy: block fails them closed.
permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write
# pull_request_target: the workflow file always executes from the base ref
# (main), so a PR that modifies this file cannot exfiltrate secrets. The
# actions/checkout step below explicitly checks out the PR head for review.
# Fork PRs are skipped at the job level (matching omar-gate.yml). Fork PRs
# do not receive the private configuration secrets (TYPESAFE_API_KEY,
# OPENAI_API_KEY, etc.) so the action cannot perform a real review. Skipping
# is safe here because the main omar-gate.yml already covers fork PRs with
# its untrusted scan path. For non-fork PRs, fork_policy: block provides
# defense-in-depth: if secrets are somehow absent, the action fails closed.
jobs:
  omar-jev:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Omar Gate (Jev intent cascade)
        uses: Sentinelayer-AIdenID/sentinelayer-v1-action@ebfcb813126ff64f21bb1fccfef8ab30609af67c
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          review_routing: intent-cascade-v1
          llm_provider: typesafe
          typesafe_api_key: ${{ secrets.TYPESAFE_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          intent_model_pin: ${{ secrets.INTENT_MODEL_PIN }}
          intent_policy: ${{ secrets.INTENT_POLICY }}
          intent_price_profile: typesafe-input-20261020
          sentinelayer_token: ${{ secrets.SENTINELAYER_TOKEN }}
          scan_mode: pr-diff
          severity_gate: P1
          codex_model: gpt-6-sol
          use_codex: "false"
          codex_only: "false"
          sentinelayer_managed_llm: "false"
          llm_failure_policy: block
          fork_policy: block
          publish_github: "true"
          comment_tag: jev
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        if: always()
        with:
          name: omar-jev-${{ github.run_id }}
          path: .sentinelayer/runs/
          include-hidden-files: true
          if-no-files-found: error
